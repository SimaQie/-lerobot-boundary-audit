name: publish-pypi

# Uploads the wheel/sdist built from a tag to PyPI via Trusted Publishing
# (OIDC). Requires a one-time "pending publisher" entry on pypi.org:
#   PyPI -> Your account -> Publishing -> Add a pending publisher
#     owner: SimaQie
#     repository: <this-repo-name>
#     workflow: publish-pypi.yml
#     environment: pypi
# Until that entry exists this workflow fails at the upload step; it never
# runs automatically on push, so CI stays green.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.4.2)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist from the tag
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
