name: release

# Tag-only: normal main-branch development must never overwrite a published
# version's release attachments. The guard below refuses to touch a release
# that already exists and is published (drafts may be finished here).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse to overwrite an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release ${GITHUB_REF_NAME} already exists and is published; refusing to overwrite."
            exit 1
          fi
      - name: Locate release notes (RELEASE_NOTES_<tag>.md or RELEASE_NOTES_<version>.md)
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat "RELEASE_NOTES_${GITHUB_REF_NAME}.md" 2>/dev/null \
              || cat "RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" 2>/dev/null \
              || echo "(no release notes file found)"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build wheel and sdist from the fixed tag
        run: |
          python -m pip install build
          python -m build
      - name: Publish the tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
          make_latest: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
          files: |
            dist/*
            USAGE.md
            USAGE.zh-CN.md
