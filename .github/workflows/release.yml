name: release

# Tag-only: normal main-branch development must never overwrite a published
# version's release attachments. The guard below refuses to touch a release
# that already exists and is published (drafts may be finished here).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse to overwrite an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release ${GITHUB_REF_NAME} already exists and is published; refusing to overwrite."
            exit 1
          fi
      - name: Verify tag, runtime, citation and release notes
        run: python tools/check_release.py --tag "${GITHUB_REF_NAME}"
      - name: Locate release notes (RELEASE_NOTES_<tag>.md or RELEASE_NOTES_<version>.md)
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat "RELEASE_NOTES_${GITHUB_REF_NAME}.md" 2>/dev/null \
              || cat "RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" 2>/dev/null
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run release-blocking tests
        run: |
          python -m pip install ".[repair,dev]"
          python -m ruff check src tests examples research/validate_real_sample.py tools
          python -m pytest -q
      - name: Build wheel and sdist from the fixed tag
        run: |
          python -m pip install build
          python -m build
      - name: Verify built artifact names and versions
        run: python tools/check_release.py --tag "${GITHUB_REF_NAME}" --dist dist
      - name: Install the wheel in an isolated environment and run smoke checks
        run: |
          python -m venv .release-env
          .release-env/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          .release-env/bin/python -m pip install "${WHEEL}[repair]"
          .release-env/bin/python -I examples/check_distribution.py --out release-check
      - name: Publish the tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
          make_latest: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
          files: |
            dist/*
            USAGE.md
            USAGE.zh-CN.md
