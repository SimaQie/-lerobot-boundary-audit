name: release

# Tag-only: normal main-branch development must never overwrite a published
# version's release attachments.
on:
  push:
    tags: ['v0.4.2rc1']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist from the fixed tag
        run: |
          python -m pip install build
          python -m build
      - name: Publish the fixed v0.4.2rc1 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2rc1
          name: "0.4.2rc1 — research preview"
          body_path: RELEASE_NOTES_0.4.2rc1.md
          prerelease: true
          make_latest: false
          files: |
            dist/*
            USAGE.md
            USAGE.zh-CN.md
