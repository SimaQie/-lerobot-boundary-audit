name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Check v0.4.2rc1 release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.4.2rc1 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create v0.4.2rc1 prerelease
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2rc1
          name: "0.4.2rc1 — research preview"
          body_path: RELEASE_NOTES_0.4.2rc1.md
          prerelease: true
          make_latest: false
          files: |
            dist/*
            USAGE.md
            USAGE.zh-CN.md
      - name: Upload release artifacts and usage guides
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.4.2rc1 dist/* USAGE.md USAGE.zh-CN.md --clobber
          gh release edit v0.4.2rc1 --notes-file RELEASE_NOTES_0.4.2rc1.md
